# Install as /config/packages/johan2_assist.yaml (packages must be enabled).
# State is reported by Johan2. Commands are button presses, not UI state.
input_button:
  johan2_assist_start:
    name: Johan2 start listening
    icon: mdi:microphone
  johan2_assist_cancel:
    name: Johan2 cancel listening
    icon: mdi:microphone-off
input_boolean:
  johan2_listening_cue:
    name: Johan2 listening beeps
    icon: mdi:volume-high
input_select:
  johan2_assist_state:
    name: Johan2 Assist state
    icon: mdi:microphone
    options:
      - offline
      - idle
      - starting
      - listening
      - processing
      - speaking
      - error
    initial: offline

script:
  voice_assist_start:
    alias: Voice - start listening on active device
    description: Start Johan2 directly, or HomeDash when it owns voice after failover.
    mode: single
    sequence:
      # The failover automation briefly selects none while changing microphones.
      - wait_template: "{{ states('input_select.voice_device') in ['johan2', 'homedash'] }}"
        timeout: '00:00:10'
        continue_on_timeout: false
      - service: >-
          {{ 'script.johan2_assist_start' if is_state('input_select.voice_device', 'johan2')
             else 'script.homedash_assist' }}
  voice_assist_cancel:
    alias: Voice - cancel listening on active device
    description: Cancel Assist on the selected voice device without a HomeDash relay for Johan2.
    mode: single
    sequence:
      - wait_template: "{{ states('input_select.voice_device') in ['johan2', 'homedash'] }}"
        timeout: '00:00:10'
        continue_on_timeout: false
      - service: >-
          {{ 'script.johan2_assist_cancel' if is_state('input_select.voice_device', 'johan2')
             else 'script.homedash_assist_cancel' }}
  johan2_assist_start:
    alias: Johan2 - start listening
    description: Start a command using Johan2 microphone without a spoken wake word.
    mode: single
    sequence:
      - service: input_button.press
        target:
          entity_id: input_button.johan2_assist_start
  johan2_assist_cancel:
    alias: Johan2 - cancel listening
    description: Cancel a pending/listening command or stop a spoken reply.
    mode: single
    sequence:
      - service: input_button.press
        target:
          entity_id: input_button.johan2_assist_cancel

automation:
  - id: johan2_assist_stale_state
    alias: Johan2 - clear stale Assist state
    description: Clear busy/listening state if the voice device stops reporting progress.
    mode: restart
    trigger:
      - platform: state
        entity_id: input_select.johan2_assist_state
        to: starting
        for: '00:00:15'
      - platform: state
        entity_id: input_select.johan2_assist_state
        to: listening
        for: '00:00:45'
      - platform: state
        entity_id: input_select.johan2_assist_state
        to: processing
        for: '00:02:00'
      - platform: state
        entity_id: input_select.johan2_assist_state
        to: speaking
        for: '00:02:00'
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.johan2_assist_state
        data:
          option: offline
