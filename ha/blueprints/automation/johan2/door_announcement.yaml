blueprint:
  name: Johan2 - Deur geopend aankondiging
  description: >-
    Spreekt een bericht uit via een Music Assistant-speler wanneer een deur
    van gesloten naar open gaat. Gebruikt een TTS-entiteit van Home Assistant
    via tts.speak en de bestaande Music Assistant-speler. Geen firmwarewijziging
    nodig. De OpenAI TTS-plugin binnen MA is geen Home Assistant TTS-entiteit.
  domain: automation
  input:
    door_sensor:
      name: Deursensor
      default: binary_sensor.achterdeur_sensor_2
      selector:
        entity:
          filter:
            - domain: binary_sensor
    speaker:
      name: Music Assistant-speler
      description: Selecteer de Johan2 AUX-entiteit van de Music Assistant-integratie.
      selector:
        entity:
          filter:
            - domain: media_player
              integration: music_assistant
    message:
      name: Bericht
      default: De achterdeur is geopend.
      selector:
        text:
          multiline: true
    tts_engine:
      name: Home Assistant TTS-engine
      description: Selecteer een beschikbare HA TTS-entiteit, bijvoorbeeld Home Assistant Cloud.
      default: tts.home_assistant_cloud
      selector:
        entity:
          filter:
            - domain: tts

triggers:
  - trigger: state
    entity_id: !input door_sensor
    from: "off"
    to: "on"
    for:
      seconds: 1

conditions: []

actions:
  - action: tts.speak
    target:
      entity_id: !input tts_engine
    data:
      media_player_entity_id: !input speaker
      message: !input message
      cache: true
  # Ignore door chatter/repeated openings while speaking and during this cooldown.
  - delay:
      seconds: 10

mode: single
max_exceeded: silent
